# OJO: ansible-runner corre ansible-playbook desde ansible/project/, así que
# este archivo NO se carga (``ansible-config dump`` ahí da CONFIG_FILE=None).
# Lo que de verdad rige son los ``envvars`` que pasa
# app/services/ansible_service.py::run_playbook() (timeouts y verificación
# de claves de host) y los defaults de ansible-runner/network_cli.
[defaults]
host_key_checking = False
timeout = 30
gathering = explicit

[persistent_connection]
command_timeout = 30
connect_timeout = 30
# Force paramiko so legacy Cisco IOS devices (SHA1-only KEX) are reachable.
# ansible-pylibssh (libssh) only offers modern KEX algorithms and cannot
# negotiate with older IOS firmware. Paramiko still supports them.
network_cli_ssh_type = paramiko

[ssh_connection]
ssh_executable = ssh
