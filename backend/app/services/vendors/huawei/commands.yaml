        - "vlan {vlan_id}"
        - "description {name}"
        - "quit"
        - "quit"

save_config:
  success_pattern: 'Save the configuration successfully'
  primary:
    block: ["save", "y"]
  alternatives:
    - triggered_by_error: '(?i)unrecognized command|wrong parameter|invalid file name|did not confirm the operation'
      block: ["save force"]

list_vlans:
  primary:
    commands: ["display vlan"]

list_ports:
  primary:
    commands:
      - "display interface brief"
      - "display interface description"
      - "display port vlan"
      - "display current-configuration interface"

_INTERFACE_WRONG_PARAM: &interface_wrong_param 'interface \S+\r?\n\s*\^\r?\nError: Wrong parameter found'

