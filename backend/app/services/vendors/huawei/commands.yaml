_TRUNK_CONFIG_REPEAT: &trunk_config_repeat
  over: "trunk_lines"
  line: "{item}"

set_trunk_config_delta:
  primary:
    block:
      - "system-view"
      - "interface {interface}"
    repeat: *trunk_config_repeat
    trailer: ["commit", "quit", "quit"]
  alternatives:
    - triggered_by_error: *interface_wrong_param
      block:
        - "system-view"
        - "interface {interface_full}"
      repeat: *trunk_config_repeat
      trailer: ["quit", "quit"]
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "interface {interface}"
      repeat: *trunk_config_repeat
