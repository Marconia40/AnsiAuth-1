      block: ["system-view", "interface Vlanif{vlan_id}", "undo traffic-filter {direction}bound acl name {acl_name}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo traffic-filter {direction}bound acl name {acl_name}"
          - "quit"
          - "quit"

set_svi_dhcp_relay:
  primary:
    block:
      - "system-view"
      - "interface Vlanif{vlan_id}"
      - "undo dhcp select relay"
      - "undo dhcp relay binding server group"
      - "quit"
      - "undo dhcp relay server group ansiauth-vlan{vlan_id}"
      - "interface Vlanif{vlan_id}"
    repeat:
      over: "servers"
      prefix_if_nonempty: ["dhcp select relay"]
      line: "dhcp relay server-ip {item}"
    trailer: ["commit", "quit", "quit"]
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo dhcp select relay"
        - "undo dhcp relay binding server group"
        - "quit"
        - "undo dhcp relay server group ansiauth-vlan{vlan_id}"
        - "interface Vlanif{vlan_id}"
      repeat:
        over: "servers"
        prefix_if_nonempty: ["dhcp select relay"]
        line: "dhcp relay server-ip {item}"
      trailer: ["quit", "quit"]
    - triggered_by_error: 'dhcp relay server-ip \S+\r?\n\s*\^\r?\nError: (?:Unrecognized|Incomplete) command'
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo dhcp relay binding server group"
        - "quit"
        - "undo dhcp relay server group ansiauth-vlan{vlan_id}"
      repeat:
        over: "servers"
        prefix_if_nonempty: ["dhcp relay server group ansiauth-vlan{vlan_id}"]
        line: "server {item} {index}"
        suffix_if_nonempty:
          - "quit"
          - "interface Vlanif{vlan_id}"
          - "dhcp select relay"
          - "dhcp relay binding server group ansiauth-vlan{vlan_id}"
        if_empty:
          - "interface Vlanif{vlan_id}"
          - "undo dhcp select relay"
      trailer: ["commit", "quit", "quit"]
    - triggered_by_error: 'dhcp relay (?:binding server group|server group ansiauth-vlan\d+)\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo dhcp select relay"
      repeat:
        over: "servers"
        prefix_if_nonempty: ["dhcp select relay"]
        line: "dhcp relay server-ip {item}"
      trailer: ["quit", "quit"]

