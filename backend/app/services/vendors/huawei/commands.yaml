create_vlan:
  primary:
    block:
      - "system-view"
      - "vlan {vlan_id}"
      - "description {name}"
      - "quit"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "vlan {vlan_id}"
        - "description {name}"
        - "quit"
        - "quit"

delete_vlan:
  primary:
